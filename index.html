<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="https://blogger.googleusercontent.com/img/a/AVvXsEiS-q1ugYCZlsBiLzJzbpA_jruI6mVLodQkrim7uXuklj3rTne3BCk4Pj4O6GhqyeY5FZaupBVjB0WefrG5YfopB2v5GSJtpjwUu0NqQ1cCfuh49bAO0-stSjjiMDAPLGwlDKF36HMisyGcjjwtjboBKccSWoKQ9X_z_jIz8ZJ57Eqc9nU6uzZKcKQmvGQ" type="image/x-icon">

<link rel="shortcut icon" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhoY7iwFAtaa4wpml7gMjhU8EFnEWSIQtE8HjIY8koC16FgR-dw7w1aOdQZpjOUkWlqCWbTvPmqHkFhKGETe_jykJylBh_INlir3GMrGxUuZgrhVMYU9vw-xlNSQGwTImyTRVDzJ1DcjfPt5405IkQNUWvu9Az_A0jbqhQFil3iPiPL1H4cE1fN0S9qHFQ/s320/A%20New%20Design%20-%20Dibuat%20dengan%20PosterMyWall%20(8).jpg" type="image/x-icon">

<title>IMAGE TO SHORT LINK</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 30px 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    color: white;
    background: #020603;
}

.background {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        linear-gradient(
            rgba(0, 8, 3, .55),
            rgba(0, 8, 3, .75)
        ),
        url("https://tmpfiles.org/dl/1793003564.6f27b8b6d65cd2c5/wtA3VZSmU1vt/image23.jpg")
        center / cover no-repeat;
}

.neon-frame {
    position: fixed;
    inset: 9px;
    border: 1px solid #39ff14;
    box-shadow: 0 0 10px #39ff14;
    pointer-events: none;
    z-index: 10;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 25px;
    text-align: center;
    background: rgba(0, 12, 5, .93);
    border: 1px solid #39ff14;
    border-radius: 16px;
    box-shadow:
        0 0 15px #39ff14,
        0 0 35px rgba(0,255,60,.2);
}

h2 {
    color: #39ff14;
    text-shadow: 0 0 12px #39ff14;
    letter-spacing: 1px;
    overflow-wrap: anywhere;
}

p {
    overflow-wrap: anywhere;
}

input[type="file"],
textarea {
    width: 100%;
    margin-top: 14px;
    padding: 12px;
    color: white;
    background: #071009;
    border: 1px solid #39ff14;
    border-radius: 8px;
}

#pasteArea {
    margin-top: 15px;
    padding: 22px 12px;
    border: 2px dashed #39ff14;
    border-radius: 10px;
    color: #39ff14;
    background: rgba(0, 30, 8, .6);
    cursor: text;
    outline: none;
}

#pasteArea:focus {
    box-shadow: 0 0 15px #39ff14;
}

#pasteArea p {
    margin-bottom: 0;
    color: #c8ffd0;
    font-size: 12px;
}

#preview {
    display: none;
    max-width: 100%;
    max-height: 260px;
    margin: 15px auto;
    border: 1px solid #39ff14;
    border-radius: 8px;
    box-shadow: 0 0 12px #39ff14;
}

button {
    width: 100%;
    margin-top: 14px;
    padding: 13px;
    color: #001900;
    background: #39ff14;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    box-shadow: 0 0 10px rgba(57,255,20,.5);
    transition: .2s;
}

button:hover {
    background: #aaff99;
    transform: translateY(-1px);
}

button:disabled {
    opacity: .6;
    cursor: wait;
    transform: none;
}

textarea {
    height: 85px;
    resize: vertical;
    overflow-wrap: anywhere;
}

#status {
    color: #39ff14;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.note {
    color: #b7d9bb;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="background"></div>
<div class="neon-frame"></div>

<div class="container">

    <h2>IMAGE TO SHORT LINK</h2>
    <p>UPLOAD GAMBAR • DAPATKAN LINK PENDEK</p>

    <!-- PILIH GAMBAR DARI KOMPUTER -->
    <input type="file" id="gambar" accept="image/*">

    <!-- PASTE SCREENSHOT LIGHTSHOT -->
    <div id="pasteArea" tabindex="0" role="button"
         aria-label="Paste screenshot Lightshot">
        📸 PASTE SCREENSHOT LIGHTSHOT
        <p>Klik di sini, lalu tekan CTRL + V</p>
        <p>Pastikan Lightshot sudah menyalin gambarnya</p>
    </div>

    <!-- PREVIEW GAMBAR -->
    <img id="preview" alt="Preview gambar">

    <!-- TOMBOL UPLOAD -->
    <button id="uploadBtn" type="button">
        ⚡ UPLOAD & BUAT LINK PENDEK ⚡
    </button>

    <p id="status" aria-live="polite">
        Siap menerima gambar, bro!
    </p>

    <!-- HASIL LINK -->
    <textarea id="hasil"
        placeholder="Link pendek zip1.io akan muncul di sini"
        readonly></textarea>

    <!-- SALIN LINK -->
    <button id="copyBtn" type="button">
        ✦ SALIN LINK ✦
    </button>

    <p class="note">IMGAGE TO LINK PINTARBOLA 💚</p>

</div>

<script>
const inputGambar = document.getElementById("gambar");
const pasteArea = document.getElementById("pasteArea");
const preview = document.getElementById("preview");
const statusEl = document.getElementById("status");
const hasil = document.getElementById("hasil");
const tombol = document.getElementById("uploadBtn");
const copyBtn = document.getElementById("copyBtn");

let previewURL = null;
let fileGambar = null;

/* TAMPILKAN GAMBAR */
function tampilkanGambar(file, pesan) {
    if (!file || !file.type.startsWith("image/")) {
        statusEl.textContent = "⚠ File harus berupa gambar.";
        return;
    }

    fileGambar = file;

    if (previewURL) {
        URL.revokeObjectURL(previewURL);
    }

    previewURL = URL.createObjectURL(file);
    preview.src = previewURL;
    preview.style.display = "block";

    hasil.value = "";
    statusEl.textContent = pesan;
}

/* PILIH GAMBAR DARI KOMPUTER */
inputGambar.addEventListener("change", function() {
    const file = this.files && this.files[0];

    if (file) {
        tampilkanGambar(
            file,
            "✓ Gambar siap di-upload, bro!"
        );
    }
});

/* PASTE GAMBAR DARI LIGHTSHOT */
function prosesPaste(event) {
    const clipboard = event.clipboardData;

    if (!clipboard || !clipboard.items) {
        statusEl.textContent =
            "⚠ Clipboard tidak dapat dibaca. Coba salin screenshot lagi.";
        return;
    }

    for (const item of clipboard.items) {
        if (
            item.kind === "file" &&
            item.type.startsWith("image/")
        ) {
            const file = item.getAsFile();

            if (file) {
                event.preventDefault();

                tampilkanGambar(
                    file,
                    "✓ Screenshot berhasil ditempel! Siap upload."
                );

                return;
            }
        }
    }

    statusEl.textContent =
        "⚠ Clipboard tidak berisi gambar. Salin screenshot sebagai gambar, bukan URL.";
}

/* AREA PASTE */
pasteArea.addEventListener("click", function() {
    pasteArea.focus();
});

pasteArea.addEventListener("paste", prosesPaste);

/* PASTE DI AREA HALAMAN LAIN */
document.addEventListener("paste", function(event) {
    const target = event.target;

    if (
        target === pasteArea ||
        target === inputGambar ||
        target === hasil ||
        target.isContentEditable
    ) {
        return;
    }

    prosesPaste(event);
});

/* UPLOAD GAMBAR DAN BUAT LINK PENDEK */
async function uploadGambar() {
    const file = fileGambar;

    if (!file) {
        statusEl.textContent =
            "⚠ Pilih gambar atau paste screenshot terlebih dahulu.";
        pasteArea.focus();
        return;
    }

    tombol.disabled = true;
    copyBtn.disabled = true;
    hasil.value = "";

    try {
        /* LANGKAH 1: UPLOAD KE TMPFILES */
        statusEl.textContent =
            "⏳ Langkah 1/2: Upload gambar...";

        const form = new FormData();
        form.append(
            "file",
            file,
            file.name || "screenshot.png"
        );

        const uploadResponse = await fetch(
            "https://tmpfiles.org/api/v1/upload",
            {
                method: "POST",
                body: form
            }
        );

        if (!uploadResponse.ok) {
            throw new Error(
                "Upload gambar gagal. HTTP " +
                uploadResponse.status
            );
        }

        const uploadData = await uploadResponse.json();

        if (!uploadData.data || !uploadData.data.url) {
            throw new Error(
                "Hosting tidak mengembalikan URL gambar."
            );
        }

        const directURL = uploadData.data.url.replace(
            "https://tmpfiles.org/",
            "https://tmpfiles.org/dl/"
        );

        /* LANGKAH 2: PENDEKKAN LINK ZIP1.IO */
        statusEl.textContent =
            "⏳ Langkah 2/2: Membuat link pendek zip1.io...";

        const shortResponse = await fetch(
            "https://zip1.io/api/create",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    url: directURL
                })
            }
        );

        const shortData = await shortResponse.json();

        if (!shortResponse.ok) {
            throw new Error(
                "Zip1.io menolak permintaan. HTTP " +
                shortResponse.status
            );
        }

        if (!shortData.short_url) {
            throw new Error(
                "Respons zip1.io tidak berisi short_url. Periksa API layanan."
            );
        }

        /* TAMPILKAN LINK PENDEK */
        hasil.value = shortData.short_url;

        statusEl.textContent =
            "✓ BERHASIL! Link pendek siap disalin, bro!";

    } catch (error) {
        console.error("Upload/shortener error:", error);

        statusEl.textContent =
            "⚠ " + error.message +
            " Jika Failed to fetch, kemungkinan API/CORS tidak mengizinkan permintaan dari halaman ini.";

    } finally {
        tombol.disabled = false;
        copyBtn.disabled = false;
    }
}

tombol.addEventListener("click", uploadGambar);

/* SALIN LINK */
copyBtn.addEventListener("click", async function() {
    if (!hasil.value) {
        statusEl.textContent =
            "⚠ Belum ada link untuk disalin.";
        return;
    }

    try {
        await navigator.clipboard.writeText(hasil.value);
        statusEl.textContent =
            "✓ Link berhasil disalin!";
    } catch (error) {
        hasil.focus();
        hasil.select();

        const copied = document.execCommand("copy");

        statusEl.textContent = copied
            ? "✓ Link berhasil disalin!"
            : "Pilih dan salin link secara manual.";
    }
});
</script>

</body>
</html>
